name: Temporal workflow compatibility

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run check
      - run: npm run check:sandbox-tests -w @space/worker
      - name: Required system tools for public tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ffmpeg
      - name: Run worker suite including real sandbox and immutable replay gate
        run: npm test -w @space/worker
      - name: Full public regression suite
        run: npm test
      - name: Build application
        run: npm run build
      - name: Ensure tests did not rewrite committed histories
        run: git diff --exit-code -- apps/worker/tests/fixtures/workflow-histories
